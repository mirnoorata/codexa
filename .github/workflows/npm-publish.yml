name: Publish Codexa to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable GitHub release tag
        required: true
        type: string
      publish:
        description: Publish after validation (otherwise only diagnose npm authentication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: codexa-npm-publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mirnoorata/codexa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      default_branch: ${{ steps.release.outputs.default_branch }}
    steps:
      - name: Resolve published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RECOVERY_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::An existing stable vMAJOR.MINOR.PATCH release tag is required."
            exit 1
          fi
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/${default_branch}" ]]; then
            echo "::error::Manual recovery must run from the default branch."
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${RUNNER_TEMP}/release.json"
          jq -e --arg tag "${RELEASE_TAG}" '.tag_name == $tag and .draft == false and .prerelease == false and .published_at != null' "${RUNNER_TEMP}/release.json" > /dev/null
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${RECOVERY_PUBLISH}" == "true" ]]; then
            latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
            if [[ "${RELEASE_TAG}" != "${latest_tag}" ]]; then
              echo "::error::Manual publishing must target the latest stable GitHub release."
              exit 1
            fi
          fi
          echo "tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "default_branch=${default_branch}" >> "${GITHUB_OUTPUT}"

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      NPM_REGISTRY: https://registry.npmjs.org
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Use provenance-capable npm
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          set -euo pipefail
          npm install -g npm@11.10.0 --registry "${NPM_REGISTRY}" --ignore-scripts
          node --version
          npm --version

      - name: Validate release package
        id: package
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_PRERELEASE: "false"
          DEFAULT_BRANCH: ${{ needs.release.outputs.default_branch }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: |
          set -euo pipefail

          if [[ "${REPOSITORY_PRIVATE}" == "true" ]]; then
            echo "::error::npm provenance for GitHub-backed publishes requires a public repository."
            exit 1
          fi

          if [[ -z "${DEFAULT_BRANCH}" ]]; then
            echo "::error::Repository default branch is unavailable in the release event."
            exit 1
          fi

          git fetch --no-tags --prune origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::Release tag ${RELEASE_TAG} does not point to a commit contained in ${DEFAULT_BRANCH}."
            exit 1
          fi

          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            echo "::error::npm publishing is stable-release-only; GitHub prereleases require an explicit dist-tag policy first."
            exit 1
          fi

          expected_name="@mirnoorata/codexa"
          expected_repository="git+https://github.com/mirnoorata/codexa.git"
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_access="$(node -p "require('./package.json').publishConfig?.access ?? ''")"
          package_repository="$(node -p "const pkg = require('./package.json'); typeof pkg.repository === 'string' ? pkg.repository : (pkg.repository?.url ?? '')")"
          expected_tag="v${package_version}"

          if [[ "${package_name}" != "${expected_name}" ]]; then
            echo "::error::package.json name must be ${expected_name}; found ${package_name}."
            exit 1
          fi

          if [[ "${package_version}" == *-* ]]; then
            echo "::error::npm publishing is stable-release-only; prerelease package version ${package_version} would not publish to latest safely."
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version tag ${expected_tag}."
            exit 1
          fi

          if [[ "${package_repository}" != "${expected_repository}" ]]; then
            echo "::error::package.json repository.url must be ${expected_repository}; found ${package_repository}."
            exit 1
          fi

          if [[ "${package_access}" != "public" ]]; then
            echo "::error::package.json publishConfig.access must be public for @mirnoorata/codexa."
            exit 1
          fi

          echo "name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"

          set +e
          npm view "${package_name}@${package_version}" version --json --registry "${NPM_REGISTRY}" >"${RUNNER_TEMP}/npm-view.json" 2>"${RUNNER_TEMP}/npm-view.err"
          status=$?
          set -e

          if [[ "${status}" -eq 0 ]]; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is already published; skipping npm publish."
            exit 0
          fi

          if grep -Eq "E404|404 Not Found|not in this registry" "${RUNNER_TEMP}/npm-view.err"; then
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is not published yet; continuing."
            exit 0
          fi

          cat "${RUNNER_TEMP}/npm-view.err" >&2
          exit "${status}"

      - name: Diagnose npm trusted publishing
        if: steps.package.outputs.already_published != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        run: |
          node --input-type=module <<'NODE'
          const registry = 'https://registry.npmjs.org';
          const packageName = '@mirnoorata/codexa';
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          if (!requestToken || !requestUrl) throw new Error('GitHub OIDC is unavailable; id-token: write is required.');
          const url = new URL(requestUrl);
          url.searchParams.set('audience', 'npm:registry.npmjs.org');
          const identity = await fetch(url, {
            headers: { Authorization: `Bearer ${requestToken}` },
            redirect: 'error', signal: AbortSignal.timeout(15000)
          });
          if (!identity.ok) throw new Error(`GitHub OIDC request failed: HTTP ${identity.status}`);
          const { value: idToken } = await identity.json();
          if (typeof idToken !== 'string' || !idToken) throw new Error('GitHub returned no OIDC token.');
          const claims = JSON.parse(Buffer.from(idToken.split('.')[1], 'base64url').toString());
          console.log('Trusted publisher identity:', JSON.stringify({
            repository: claims.repository, workflow_ref: claims.workflow_ref,
            ref: claims.ref, event_name: claims.event_name
          }));
          const exchange = await fetch(`${registry}/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`, {
            method: 'POST', headers: { Authorization: `Bearer ${idToken}` },
            redirect: 'error', signal: AbortSignal.timeout(15000)
          });
          if (!exchange.ok) {
            const body = await exchange.json().catch(() => ({}));
            let message = String(body.message || body.error || 'No registry error detail');
            for (const secret of [requestToken, idToken]) message = message.split(secret).join('[redacted]');
            console.error(`npm trusted publishing rejected: HTTP ${exchange.status}; ${JSON.stringify(message.slice(0, 1000))}`);
            process.exit(1);
          }
          const credential = await exchange.json();
          if (typeof credential.token !== 'string' || !credential.token) throw new Error('npm returned no publish credential.');
          console.log('npm trusted publishing accepted. The temporary credential is discarded; nothing was published.');
          NODE

      - name: Install dependencies
        if: steps.package.outputs.already_published != 'true' && (github.event_name == 'release' || inputs.publish)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: npm ci

      - name: Run security gate
        if: steps.package.outputs.already_published != 'true' && (github.event_name == 'release' || inputs.publish)
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ""
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ""
        run: npm run security:check

      - name: Publish to npm with provenance
        if: steps.package.outputs.already_published != 'true' && (github.event_name == 'release' || inputs.publish)
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          set +e
          npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --json --registry "${NPM_REGISTRY}" >"${RUNNER_TEMP}/npm-view-final.json" 2>"${RUNNER_TEMP}/npm-view-final.err"
          status=$?
          set -e

          if [[ "${status}" -eq 0 ]]; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} was published after the security gate; skipping npm publish."
            exit 0
          fi

          if ! grep -Eq "E404|404 Not Found|not in this registry" "${RUNNER_TEMP}/npm-view-final.err"; then
            cat "${RUNNER_TEMP}/npm-view-final.err" >&2
            exit "${status}"
          fi

          npm publish --registry "${NPM_REGISTRY}" --access public --tag latest --provenance --ignore-scripts

  mcp-registry:
    needs: [release, publish]
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false

      - name: Verify server.json matches the release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          server_version="$(node -p "require('./server.json').version")"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${server_version}" || "${server_version}" != "${package_version}" ]]; then
            echo "::error::server.json version ${server_version} does not match release ${RELEASE_TAG} / package ${package_version}."
            exit 1
          fi

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "${archive}" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
