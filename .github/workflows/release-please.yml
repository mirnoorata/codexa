name: Release Please

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'mirnoorata/codexa' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GITHUB_TOKEN does not automatically trigger release: published or push
      # workflows. Explicit dispatches keep CI and publishing automatic.
      - name: Start publishing the created release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release Please must produce a stable vMAJOR.MINOR.PATCH tag."
            exit 1
          fi
          gh workflow run npm-publish.yml --repo "${GITHUB_REPOSITORY}" --ref main \
            --raw-field "tag=${RELEASE_TAG}" --raw-field publish=true

      - name: Start checks for the release PR
        if: steps.release.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const { number } = JSON.parse(process.env.RELEASE_PR);
          if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Invalid release PR number');
          const repo = process.env.GITHUB_REPOSITORY;
          const pr = JSON.parse(execFileSync('gh', ['api', `repos/${repo}/pulls/${number}`], { encoding: 'utf8' }));
          if (pr.state !== 'open' || pr.base.repo.full_name !== repo || pr.head.repo.full_name !== repo ||
              pr.base.ref !== 'main' || pr.head.ref !== 'release-please--branches--main') {
            throw new Error('Expected an open, same-repository Release Please PR targeting main');
          }
          execFileSync('gh', ['workflow', 'run', 'check.yml', '--repo', repo, '--ref', pr.head.ref], { stdio: 'inherit' });
          NODE
