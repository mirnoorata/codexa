name: Codexa Check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: codexa-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skip fork PRs by default — prevents drive-by Actions-minute abuse.
    # Belt-and-braces with GitHub's "Require approval for all outside
    # collaborators" setting; do not rely on either alone.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce clean-runner parity
        run: rm -rf dist .codex/codebase .codex/cache

      - name: Run Codexa gates
        run: npm run check

      # The retrieval-quality gate: a scenario FAILS outright if the raw
      # rg/git baseline beats Codexa, output exceeds budgets, or packets are
      # heuristic-heavy. Seeded per commit so the synthetic anti-cheat
      # holdouts cannot be overfitted. `npm run check` already built dist.
      - name: Run retrieval eval gate (fails if raw grep wins)
        run: npm run eval:ci

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codexa-eval-report
          path: .codex/cache/codexa-eval/latest.json
          if-no-files-found: ignore
          retention-days: 30

  package-smoke:
    # Keep this as a separate source-to-tarball gate so package installation
    # failures cannot be hidden by source-tree tests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run package install smoke
        run: npm run smoke:package

  worktree-bootstrap:
    # Exercise both tracked setup lanes on their native hosts. Source-string
    # assertions cannot prove PowerShell path semantics or receipt consumption.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Create linked Git worktree
        run: git worktree add --detach ../codexa-linked-worktree HEAD

      - name: Run POSIX worktree bootstrap
        if: runner.os != 'Windows'
        working-directory: ../codexa-linked-worktree
        run: bash .codex/worktree-bootstrap.sh

      - name: Run production Windows PowerShell bootstrap command
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ../codexa-linked-worktree
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./.codex/worktree-bootstrap.ps1

      - name: Run post-bootstrap test smoke
        working-directory: ../codexa-linked-worktree
        run: npx vitest run tests/worktree-environment.test.ts

      - name: Validate consumed setup receipt
        working-directory: ../codexa-linked-worktree
        run: node dist/cli.js worktree-receipt validate . --json

      - name: Verify bootstrap concurrency lock
        working-directory: ../codexa-linked-worktree
        run: node scripts/worktree-bootstrap.mjs --verify-lock .

  worktree-bootstrap-macos-lock:
    # macOS uses its native process start time to distinguish a live lock
    # owner from an unrelated process that later reused the same PID.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify bootstrap concurrency lock
        run: node scripts/worktree-bootstrap.mjs --verify-lock .

  benchmark:
    # Guard only against clear hot-path regressions; thresholds live in the
    # benchmark script and are intentionally generous for shared CI runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Run hot-path benchmark
        run: npm run benchmark:ci

      - name: Run pinned transport benchmark
        run: npm run benchmark:transport -- --output .codex/cache/codexa-benchmarks/transport.json

      - name: Upload benchmark data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codexa-hot-path-benchmark
          path: .codex/cache/codexa-benchmarks/*.json
          if-no-files-found: ignore
          retention-days: 7
