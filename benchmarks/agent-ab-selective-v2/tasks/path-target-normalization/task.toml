schema_version = "1.3"
artifacts = [
  { source = "/workspace/project", exclude = [".git", ".codex", "__pycache__", "*.pyc"] },
  "/logs/artifacts/",
]

[task]
name = "codexa-agent-ab-selective-v2/path-target-normalization"
description = "Public schema-v2 conformance fixture for exact path-target normalization"
authors = [{ name = "Codexa contributors" }]
keywords = ["coding-agent", "conformance", "path-validation", "source-only"]

[agent]
timeout_sec = 900
network_mode = "public"

[environment]
build_timeout_sec = 600
network_mode = "public"
cpus = 2
memory_mb = 2048
storage_mb = 4096

[verifier]
timeout_sec = 120
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
memory_mb = 512
storage_mb = 1024
